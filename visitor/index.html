<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Hot Springs visitor survey: 5 questions, about 2 minutes.">
<meta name="theme-color" content="#F1F4EF">
<link rel="icon" href="/assets/logo-green-560.png">
<style>body{margin:0}img{max-width:100%}[hidden]{display:none!important}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}</style>
<title>Tell Us About Your Visit</title>
</head>
<body>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link id="gf" rel="stylesheet" media="print" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Zilla+Slab:wght@600;700&display=swap">
<style>
/* One screen at a time over a fixed frame: progress bar on top, question in the middle, arrows bottom right.
   A single branded look (HSTA green and blue on pale sage), the same for every viewer. */
:root{
  --bg:#F1F4EF; --ink:#1A2B24; --muted:#5B6B63;
  --green:#4D6D58; --blue:#20456E; --blue-ink:#FFFFFF; --card:#FFFFFF;
  --opt:rgba(32,69,110,.06); --opt-line:rgba(32,69,110,.32); --opt-on:rgba(32,69,110,.15);
  --track:rgba(77,109,88,.18); --err:#A3271F; --err-bg:#FBE9E7;
  --body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  --display:"Zilla Slab",Rockwell,Georgia,serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.45;overflow:hidden}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--blue);outline-offset:3px}

#app{position:relative;height:100%;overflow:hidden}
.top{position:absolute;left:0;right:0;top:0;z-index:5;padding:0 20px;background:linear-gradient(var(--bg) 72%,rgba(241,244,239,0))}
.bar{height:5px;background:var(--track);margin:0 -20px}
.bar i{display:block;height:100%;width:0;background:var(--green);border-radius:0 3px 3px 0;transition:width .6s cubic-bezier(.2,.8,.2,1)}
.topin{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0 10px;max-width:58rem;margin:0 auto}
.topin img{height:34px;width:auto}
.count{font-size:.85rem;color:var(--muted);font-variant-numeric:tabular-nums}
.pill{font-size:.75rem;font-weight:600;color:var(--green);border:1px solid var(--track);background:var(--card);padding:3px 9px;border-radius:99px;white-space:nowrap}

#stage{position:absolute;inset:0}
.screen{position:absolute;inset:0;overflow-y:auto;display:flex;opacity:0;transform:translateY(calc(var(--d,1) * 56px));
  transition:opacity .42s ease,transform .6s cubic-bezier(.2,.8,.2,1);pointer-events:none}
.screen.cur{opacity:1;transform:none;pointer-events:auto}
.screen.out{opacity:0;transform:translateY(calc(var(--d,1) * -56px));transition-duration:.32s,.45s}
.inner{margin:auto;width:100%;max-width:42rem;padding:104px 24px 128px;display:flex;flex-direction:column;gap:18px}
.screen.cur .inner > *{animation:rise .6s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--k,0) * 55ms + 80ms)}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}

.qhead{display:flex;gap:12px;align-items:flex-start}
.qnum{flex:none;color:var(--blue);font-weight:700;font-size:1rem;margin-top:.45rem;display:flex;gap:4px;align-items:center;font-variant-numeric:tabular-nums}
.qnum svg{width:14px;height:14px}
h1{font-family:var(--display);font-weight:700;font-size:clamp(2rem,6vw,2.9rem);line-height:1.1;margin:0;text-wrap:balance}
h2{font-weight:600;font-size:clamp(1.35rem,3.6vw,1.75rem);line-height:1.3;margin:0;text-wrap:balance}
h1:focus,h2:focus{outline:none}
.pre{margin:0}
.hint{color:var(--muted);font-size:.95rem;margin:0}
.sub{font-weight:600;color:var(--green);margin:0}
.lead{font-size:1.15rem;margin:0;max-width:34rem}
.meta{color:var(--muted);margin:0}

.opts{display:flex;flex-direction:column;gap:8px;max-width:34rem}
.opt{display:flex;align-items:center;gap:12px;text-align:left;width:100%;background:var(--opt);border:1px solid var(--opt-line);border-radius:8px;padding:9px 12px;cursor:pointer;
  transition:background .15s,border-color .15s,transform .15s,opacity .2s}
@media (hover:hover){.opt:hover{background:var(--opt-on)}}
.opt:active{transform:scale(.99)}
.key{flex:none;width:26px;height:26px;border:1px solid var(--opt-line);border-radius:5px;background:var(--card);display:flex;align-items:center;justify-content:center;font-size:.75rem;font-weight:700;color:var(--blue);transition:background .15s,color .15s}
.opt .lab{flex:1;min-width:0}
.tick{flex:none;width:20px;height:20px;opacity:0;transform:scale(.6);transition:opacity .2s,transform .25s cubic-bezier(.2,1.6,.4,1);color:var(--blue)}
.opt.on{background:var(--opt-on);border-color:var(--blue);box-shadow:inset 0 0 0 1px var(--blue)}
.opt.on .key{background:var(--blue);color:var(--blue-ink);border-color:var(--blue)}
.opt.on .tick{opacity:1;transform:none}
.opt.blink{animation:blink .3s 2}
@keyframes blink{50%{background:var(--opt)}}
.opt.dim{opacity:.5}

.line{font:inherit;font-size:1.2rem;color:var(--ink);background:transparent;border:0;border-bottom:2px solid var(--opt-line);padding:8px 2px;width:100%;max-width:34rem;border-radius:0;transition:border-color .2s}
.line::placeholder{color:rgba(32,69,110,.45)}
.line:focus{outline:none;border-bottom-color:var(--blue)}
textarea.line{resize:none;min-height:3.2rem;line-height:1.4;overflow:hidden;display:block}
.reveal{display:flex;flex-direction:column;gap:4px;max-width:34rem;padding:2px 0 6px;animation:rise .35s cubic-bezier(.2,.8,.2,1) both}
.reveal label{font-size:.9rem;color:var(--muted)}
.fields{display:flex;flex-direction:column;gap:18px;max-width:34rem}
.field{display:flex;flex-direction:column;gap:4px}
.field label{font-size:.9rem;color:var(--muted)}
.row{display:flex;gap:8px;flex-wrap:wrap}
.row .opt{width:auto;min-width:8rem}

.act{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.btn{background:var(--blue);color:var(--blue-ink);border:0;border-radius:8px;padding:10px 18px;font-weight:700;font-size:1.05rem;cursor:pointer;display:inline-flex;gap:8px;align-items:center;transition:transform .15s,box-shadow .2s}
@media (hover:hover){.btn:hover{box-shadow:0 6px 18px rgba(32,69,110,.25)}}
.btn:active{transform:translateY(1px)}
.btn.ghost{background:transparent;color:var(--blue);border:1px solid var(--opt-line)}
.btn svg{width:18px;height:18px}
.btn.busy{pointer-events:none;opacity:.9}
.spin{width:18px;height:18px;border:2px solid rgba(255,255,255,.4);border-top-color:var(--blue-ink);border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.enter{font-size:.8rem;color:var(--muted)}
.enter b{font-weight:600}
.errs:empty{display:none}
.err{display:inline-flex;gap:6px;align-items:center;background:var(--err-bg);color:var(--err);font-weight:600;font-size:.9rem;padding:6px 10px;border-radius:6px;animation:rise .25s both}
.shake{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(7px)}}
.limit{font-size:.9rem;color:var(--muted);font-variant-numeric:tabular-nums;margin:0}

.nav{position:absolute;right:20px;bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:5;display:flex;gap:2px}
.nav button{width:40px;height:36px;border:0;background:var(--blue);color:var(--blue-ink);cursor:pointer;display:flex;align-items:center;justify-content:center}
.nav button:first-child{border-radius:6px 0 0 6px}
.nav button:last-child{border-radius:0 6px 6px 0}
.nav button:disabled{opacity:.35;cursor:default}
body.typing .nav{opacity:0;pointer-events:none}
.nav{transition:opacity .2s}
.nav svg{width:18px;height:18px}

.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(15rem,1fr));gap:14px}
.card{text-align:left;background:var(--card);border:1px solid var(--track);border-radius:12px;padding:20px;cursor:pointer;display:flex;flex-direction:column;gap:6px;transition:transform .2s,box-shadow .25s,border-color .2s}
@media (hover:hover){.card:hover{transform:translateY(-3px);box-shadow:0 12px 28px rgba(26,43,36,.12);border-color:var(--green)}}
.card .k{font-size:.75rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--green)}
.card .t{font-family:var(--display);font-weight:700;font-size:1.35rem;line-height:1.2}
.card .m{color:var(--muted);font-size:.92rem}
.logo-lg{width:min(15rem,70%);height:auto}
.check-big{width:64px;height:64px;color:var(--green)}
.check-big circle{stroke-dasharray:160;stroke-dashoffset:160;animation:draw .7s .15s ease forwards}
.check-big path{stroke-dasharray:40;stroke-dashoffset:40;animation:draw .4s .7s ease forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.follow{display:flex;flex-wrap:wrap;gap:6px 16px;align-items:center;color:var(--muted);font-size:.9rem}
.follow .fl{font-weight:700;color:var(--ink)}
.follow .fi{display:inline-flex;gap:6px;align-items:center}
.follow svg{width:17px;height:17px;flex:none;color:var(--green)}
.note{font-size:.85rem;color:var(--muted);margin:0}

@media (max-width:520px){
  body{font-size:16px}
  .inner{padding:92px 18px 120px;gap:16px}
  .enter,.pill{display:none}
}
@media (prefers-reduced-motion:reduce){
  .screen,.screen.out{transition:opacity .2s ease;transform:none!important}
  .screen.cur .inner > *,.reveal,.err,.opt.blink,.shake{animation:none}
  .check-big circle,.check-big path{animation:none;stroke-dashoffset:0}
}
</style>

<div id="app">
  <div class="top">
    <div class="bar" role="progressbar" aria-label="Survey progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><i id="bar"></i></div>
    <div class="topin">
      <img src="/assets/logo-green-560.png" alt="Hot Springs, North Carolina">
      <span class="count" id="count" aria-live="polite"></span>
      <span class="pill" id="pill">Demo · answers are not saved</span>
    </div>
  </div>
  <main id="stage"></main>
  <input id="hp" name="website" type="text" tabindex="-1" autocomplete="off" aria-hidden="true" style="position:absolute;left:-9999px;width:1px;height:1px;opacity:0">
  <div class="nav" id="nav" hidden>
    <button type="button" id="prev" aria-label="Previous question"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M6 15l6-6 6 6"/></svg></button>
    <button type="button" id="next" aria-label="Next question"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg></button>
  </div>
</div>

<script>
document.getElementById("gf").media = "all";
var O = {other:true};
function X(l){return {x:true,label:l};}
function D(l){return {d:true,label:l};}
var SURVEYS = {
  member:{
    title:"HSTA Member Business Survey",
    sub:"Help shape tourism in Hot Springs, NC",
    intro:"HSTA invites local business owners to share what’s working, what could improve, and how we can better support our business community. Your feedback will help guide discussion at the November 10 social and inform future tourism promotion.",
    meta:"<strong>Time:</strong> About 5 minutes<br>Please submit one response per business. Business name and contact information are optional.",
    submit:"Submit member survey",
    thanks:"Thank you for helping strengthen Hot Springs’ business community!",
    qs:[
      {t:"What type of business do you operate?",type:"check",hint:"Select all that apply.",req:1,o:["Lodging / accommodations","Retail / shopping","Restaurant / café / food and beverage","General / professional services","Outdoor recreation / guide service / outfitter","Wellness / spa",O]},
      {t:"Overall, how well is HSTA supporting your business’s tourism-related needs?",type:"radio",hint:"Select one.",req:1,o:["Very well","Somewhat well","Neither well nor poorly","Not very well","Not at all well","Not familiar enough with HSTA’s work to say"]},
      {t:"What is HSTA doing well, and what could we improve?",type:"text",hint:"Optional written response."},
      {t:"Which priorities would most help your business?",type:"check",max:3,hint:"Choose up to three.",req:1,o:["Bring more visitors to Hot Springs","Encourage overnight and longer stays","Increase weekday and slower-season visits","Promote local shopping, dining, lodging, and services","Improve visitor information about business hours and services","Strengthen referrals and partnerships among businesses","Promote events and activities","Provide marketing education and practical assistance",O]},
      {t:"Which sources currently bring customers to your business?",type:"check",max:3,hint:"Choose up to three that you believe are most effective.",req:1,o:["Google Search / Google Maps","Social media","HSTA website / tourism promotion","Welcome Center referrals","Referrals from other local businesses","Word of mouth / repeat customers","FarOut app","Booking or travel-review websites","Print advertising / brochures","Events","Walk-by / drive-by traffic",X("Not sure"),O]},
      {t:"Where should HSTA focus its advertising and promotion?",type:"check",max:3,hint:"Choose up to three.",req:1,o:["Google search advertising","Social media advertising","Hot Springs website content and business listings","Regional travel publications and visitor guides","Outdoor recreation and Appalachian Trail audiences","Email newsletters","Event promotion","Joint promotions or packages with local businesses","Stories and coverage in travel media",O,X("Not sure")]},
      {t:"What specific advertising idea, audience, or Hot Springs story should HSTA consider?",type:"text",pre:"For example: a weekday getaway, local shopping and dining, mineral springs, or a hiking weekend.",hint:"Optional written response."},
      {t:"Are the hours shown for your business on Google Search and Google Maps correct, including seasonal or holiday changes?",type:"radio",hint:"Select one.",req:1,o:["Yes — I have checked them recently","I believe so, but have not checked recently","No — they need updating","My business does not have a Google listing","I’m not sure how to find or update them","Not applicable — my business does not have regular public hours"]},
      {t:"How do you currently use the FarOut app in connection with your business?",type:"radio",hint:"Select one.",req:1,o:["I regularly use it to check information relevant to my business or visiting hikers","I use it occasionally","I know about it but do not use it","I have not heard of it","It does not seem relevant to my business"]},
      {t:"What practical support would you find useful?",type:"check",hint:"Select all that apply.",req:1,o:["Reviewing or updating my Google business information and hours","Learning about FarOut and how visitors use it","Improving my HSTA business listing","Creating social media content or advertising","Participating in cross-promotions with other businesses","Sharing accurate visitor information and local recommendations","Collecting and using visitor feedback",X("None at this time"),O]},
      {t:"What is the biggest tourism-related challenge facing your business right now?",type:"text",hint:"Written response."},
      {t:"How would you like to participate in HSTA activities?",type:"check",hint:"Select all that apply.",req:1,o:["Joint advertising or promotions","Referring customers to other local businesses","Hosting or supporting an event","Displaying visitor surveys or a survey QR code","Sharing photos, news, or offers for HSTA promotion","Helping with a committee or project","Receiving information before deciding",X("Not at this time"),O]},
      {t:"What question or idea would you like discussed at the November 10 social?",type:"text",hint:"Optional written response."},
      {t:"Optional business and follow-up information",type:"contact"}
    ]
  },
  visitor:{
    title:"Tell Us About Your Visit",
    sub:"Hot Springs Tourism Association • Visitor Survey",
    intro:"Help us make Hot Springs even better for visitors.",
    meta:"<strong>Just 5 questions • About 2 minutes • No name or email requested</strong>",
    submit:"Submit visitor survey",
    thanks:"Thank you for visiting Hot Springs and sharing your thoughts!",
    footer:"One survey per visit, please, on paper or online.",
    paperFooter:"Please hand your survey to the staff where you picked it up. One survey per visit, please, on paper or online.",
    qs:[
      {t:"How did you first hear about Hot Springs, NC?",type:"radio",hint:"Choose one.",req:1,detail:"Which one? (magazine, station or platform)",paperDetail:"Which one? (magazine, station or platform)",o:["Friends or family","Google or online search",D("Social media"),D("Travel website, magazine or guide"),D("Radio advertising"),"Appalachian Trail / hiking community","FarOut app","A local business or visitor center","Passed through / saw a sign","Known it for years / don’t remember",O]},
      {t:"Are you staying overnight on this trip?",type:"radio",hint:"Choose one.",req:1,post:"Camping and staying with friends count.",o:["Yes, 1 night in Hot Springs","Yes, 2–3 nights in Hot Springs","Yes, 4 or more nights in Hot Springs","Yes, staying nearby and visiting","No, here for the day / passing through","I live in the area"]},
      {t:"Is this your first visit to Hot Springs?",type:"radio",hint:"Choose one.",req:1,o:["Yes, my first visit","No, I’ve been before","No, I come here regularly","I live in the area"]},
      {t:"What are you doing on this visit?",type:"check",hint:"Select all that apply.",req:1,o:["Mineral springs / spa","Hiking / Appalachian Trail","French Broad River: paddling, rafting, fishing","Shopping, arts and crafts","Restaurants, cafés, food and drink","Events or live music","Exploring town and local history","Relaxing and enjoying the scenery","Visiting friends or family","Resupplying on a hike",O]},
      {t:"What would make your next visit to Hot Springs better?",type:"text",pre:"Anything you didn’t enjoy, missed, or would like to see in town. Leave blank if nothing comes to mind."}
    ]
  }
};

var ICON = {
  ig:'<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="5" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="12" cy="12" r="4" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="17.4" cy="6.6" r="1.25" fill="currentColor"/></svg>',
  tt:'<svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M16.4 2.5c.4 2.3 1.9 3.8 4.2 4v3.2c-1.6 0-3-.5-4.2-1.3v6.6a5.8 5.8 0 1 1-5.8-5.8l.9.1v3.3a2.6 2.6 0 1 0 1.7 2.4V2.5h3.2z"/></svg>',
  fb:'<svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 2a10 10 0 0 0-1.6 19.9v-7H7.9V12h2.5V9.8c0-2.5 1.5-3.9 3.8-3.9 1.1 0 2.2.2 2.2.2v2.5h-1.3c-1.2 0-1.6.8-1.6 1.6V12h2.8l-.4 2.9h-2.4v7A10 10 0 0 0 12 2z"/></svg>'
};
var FOLLOW = '<span class="fl">Follow us</span><span class="fi">'+ICON.ig+ICON.tt+'<span>Instagram &amp; TikTok: @hotsprings.nc.tourism</span></span><span class="fi">'+ICON.fb+'<span>Facebook: /HotSpringsTourismAssociation</span></span>';

var CONFIG = {"endpoint": "https://script.google.com/macros/s/AKfycbyxRdrGQ0Yk8J9BrmyrZoBJhBEBb9gtePNUu9bXG76rzJbPrTad-VZTyKyRl7OAz2SFNQ/exec", "version": "2026-10-20", "links": {"visitor": "/visitor/", "member": "/member/"}, "preset": "visitor"};
var DEMO = !CONFIG.endpoint;
if (!DEMO) document.getElementById("pill").hidden = true;
var LOGO = "/assets/logo-green-560.png";
var SVG = {
  arrow:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>',
  tick:'<svg class="tick" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>',
  ok:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>',
  warn:'<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 7.5v5.5M12 16.5v.01"/></svg>',
  done:'<svg class="check-big" viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="32" cy="32" r="25"/><path d="M21 33l7.5 7.5L43.5 25"/></svg>'
};
var KEYS = "ABCDEFGHIJKLMNOPQRSTUVWXYZ";
var state = {sid:null, i:0, answers:{}, busy:false, rid:""};
var stage = document.getElementById("stage");

function esc(s){ var d = document.createElement("div"); d.textContent = s; return d.innerHTML; }
function el(tag, cls, html){ var e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; }
function label(o){ return o === O ? "Other" : (o.label || o); }
function survey(){ return SURVEYS[state.sid]; }
function total(){ return survey().qs.length; }
function ans(n){ var k = state.sid + n; return state.answers[k] || (state.answers[k] = {choice:null, choices:[], other:"", detail:"", text:"", contact:{biz:"", name:"", email:"", perm:null}}); }
function logoImg(){ var i = el("img","logo-lg"); i.src = LOGO; i.alt = "Hot Springs, North Carolina"; return i; }

/* ---------- screen swapping ---------- */
function swap(node, dir){
  node.classList.add("screen");
  node.style.setProperty("--d", dir);
  Array.prototype.forEach.call(node.querySelector(".inner").children, function(c, k){ c.style.setProperty("--k", k); });
  var old = stage.querySelector(".screen.cur");
  stage.appendChild(node);
  node.getBoundingClientRect();
  requestAnimationFrame(function(){
    node.classList.add("cur");
    if (old){ old.style.setProperty("--d", dir); old.classList.remove("cur"); old.classList.add("out"); setTimeout(function(){ old.remove(); }, 520); }
  });
  setTimeout(function(){
    if (!node.classList.contains("cur")) return;
    var f = node.querySelector("[data-autofocus]") || node.querySelector("h2,h1");
    if (f){ if (/H1|H2/.test(f.tagName)) f.setAttribute("tabindex","-1"); f.focus({preventScroll:true}); }
  }, 380);
}

function setBar(p){ document.getElementById("bar").style.width = p + "%"; document.querySelector(".bar").setAttribute("aria-valuenow", p); }
function chrome(){
  var nav = document.getElementById("nav"), count = document.getElementById("count");
  if (!state.sid){ nav.hidden = true; count.textContent = ""; setBar(0); return; }
  var n = state.i, T = total(), onQ = n >= 1 && n <= T;
  nav.hidden = !onQ;
  document.getElementById("prev").disabled = n <= 1;
  count.textContent = onQ ? n + " of " + T : (n > T ? "Done" : "");
  setBar(n > T ? 100 : onQ ? Math.round((n - 1) / T * 100) : 0);
}

function go(i, dir){
  state.i = i;
  var T = total();
  swap(i === 0 ? welcome() : i <= T ? question(i) : endScreen(), dir);
  chrome();
}

/* ---------- screens ---------- */
function chooser(){
  state.sid = null;
  var s = el("section"), inner = el("div","inner");
  inner.appendChild(logoImg());
  inner.appendChild(el("h1",null,"HSTA surveys"));
  inner.appendChild(el("p","lead","Two short surveys from the Hot Springs Tourism Association. Pick one to try it the way a visitor or a member would."));
  var cards = el("div","cards");
  [["visitor","For visitors","Tell Us About Your Visit","5 questions · about 2 minutes"],["member","For HSTA members","Member Business Survey","14 questions · about 5 minutes"]].forEach(function(c){
    var b = el("button","card",'<span class="k">'+c[1]+'</span><span class="t">'+c[2]+'</span><span class="m">'+c[3]+'</span>');
    b.type = "button";
    b.addEventListener("click", function(){ if (CONFIG.links) location.href = CONFIG.links[c[0]]; else start(c[0]); });
    cards.appendChild(b);
  });
  inner.appendChild(cards);
  inner.appendChild(el("p","note", DEMO ? "This is a working demo. Nothing you enter is saved. When the surveys go live, each will have its own link and QR code." : "Each one takes just a few minutes. Thank you for helping shape Hot Springs."));
  s.appendChild(inner);
  swap(s, 1); chrome();
}

function newId(){
  if (window.crypto && crypto.randomUUID) return crypto.randomUUID();
  return "r-" + Date.now().toString(36) + "-" + Math.random().toString(36).slice(2, 12);
}
function start(sid){
  state.sid = sid; state.answers = {}; state.rid = newId();
  if (!CONFIG.preset) try { history.replaceState(null, "", "#" + sid); } catch(e){}
  go(0, 1);
}

function welcome(){
  var s = survey(), sec = el("section"), inner = el("div","inner");
  inner.appendChild(logoImg());
  inner.appendChild(el("h1",null,esc(s.title)));
  inner.appendChild(el("p","sub",esc(s.sub)));
  inner.appendChild(el("p","lead",esc(s.intro)));
  inner.appendChild(el("p","meta",s.meta));
  var act = el("div","act"), b = el("button","btn","Start " + SVG.arrow);
  b.type = "button"; b.setAttribute("data-autofocus",""); b.addEventListener("click", next);
  act.appendChild(b); act.appendChild(el("span","enter","press <b>Enter ↵</b>"));
  inner.appendChild(act);
  sec.appendChild(inner);
  return sec;
}

function question(n){
  var q = survey().qs[n-1], a = ans(n), sec = el("section"), inner = el("div","inner");
  sec.dataset.n = n;
  var head = el("div","qhead");
  head.appendChild(el("span","qnum", n + SVG.arrow));
  var h = el("h2"); h.id = "q" + n; h.textContent = q.t; head.appendChild(h);
  inner.appendChild(head);
  if (q.pre) inner.appendChild(el("p","pre",esc(q.pre)));
  var hint = q.max ? "Choose up to " + q.max + "." : (q.hint || "");
  if (q.type === "contact") hint = "All optional.";
  else if (!q.req && !/optional/i.test(hint)) hint = (hint ? hint + " " : "") + "Optional.";
  if (hint) inner.appendChild(el("p","hint",esc(hint)));

  if (q.type === "radio" || q.type === "check") inner.appendChild(choices(q, a, n));
  else if (q.type === "text") inner.appendChild(textBox(q, a, n));
  else if (q.type === "contact") inner.appendChild(contact(a));

  if (q.post) inner.appendChild(el("p","hint",esc(q.post)));
  if (q.max) inner.appendChild(el("p","limit",""));
  inner.appendChild(el("div","errs"));
  inner.appendChild(actions(n));
  sec.appendChild(inner);
  sync(sec, q, a);
  return sec;
}

function choices(q, a, n){
  var wrap = el("div","opts");
  wrap.setAttribute("role", q.type === "radio" ? "radiogroup" : "group");
  wrap.setAttribute("aria-labelledby", "q" + n);
  q.o.forEach(function(o, j){
    var b = el("button","opt",'<span class="key">'+KEYS[j]+'</span><span class="lab">'+esc(label(o))+'</span>'+SVG.tick);
    b.type = "button"; b.dataset.j = j;
    b.setAttribute("role", q.type === "radio" ? "radio" : "checkbox");
    b.addEventListener("click", function(){ pick(q, a, n, j, b); });
    wrap.appendChild(b);
    if (o === O){
      var r = el("div","reveal"); r.dataset.for = "other"; r.hidden = true;
      var inp = el("input","line"); inp.type = "text"; inp.placeholder = "Type your answer…"; inp.setAttribute("aria-label","Other, please say"); inp.value = a.other;
      inp.addEventListener("input", function(){ a.other = inp.value; clearErr(); });
      r.appendChild(inp); wrap.appendChild(r);
    }
  });
  if (q.detail){
    var r = el("div","reveal"); r.dataset.for = "detail"; r.hidden = true;
    r.innerHTML = '<label for="d'+n+'">'+esc(q.detail)+' · optional</label>';
    var inp = el("input","line"); inp.type = "text"; inp.id = "d" + n; inp.value = a.detail;
    inp.addEventListener("input", function(){ a.detail = inp.value; });
    r.appendChild(inp); wrap.appendChild(r);
  }
  return wrap;
}

function pick(q, a, n, j, btn){
  clearErr();
  var o = q.o[j], sec = btn.closest(".screen");
  if (q.type === "radio"){
    a.choice = j; sync(sec, q, a);
    btn.classList.remove("blink"); void btn.offsetWidth; btn.classList.add("blink");
    if (o === O){ focusReveal(sec, "other"); return; }
    if (o.d && q.detail){ focusReveal(sec, "detail"); return; }
    setTimeout(function(){ if (state.i === n && a.choice === j) next(); }, 620);
    return;
  }
  var i = a.choices.indexOf(j);
  if (i >= 0) a.choices.splice(i, 1);
  else if (o.x) a.choices = [j];
  else {
    var kept = a.choices.filter(function(k){ return !q.o[k].x; });
    if (q.max && kept.length >= q.max){ showErr(sec, "You can choose up to " + q.max + ". Untick one to change."); return; }
    kept.push(j); a.choices = kept;
  }
  sync(sec, q, a);
  if (a.choices.indexOf(j) >= 0){ btn.classList.remove("blink"); void btn.offsetWidth; btn.classList.add("blink"); }
  if (o === O && a.choices.indexOf(j) >= 0) focusReveal(sec, "other");
}

function focusReveal(sec, which){
  var r = sec.querySelector('.reveal[data-for="'+which+'"]');
  if (r) setTimeout(function(){ r.querySelector("input").focus(); }, 60);
}

function sync(sec, q, a){
  if (q.o){
    var picked = q.type === "radio" ? (a.choice == null ? [] : [a.choice]) : a.choices;
    sec.querySelectorAll(".opt").forEach(function(b){
      var on = picked.indexOf(+b.dataset.j) >= 0;
      b.classList.toggle("on", on); b.setAttribute("aria-checked", on ? "true" : "false");
    });
    var oi = q.o.indexOf(O), ro = sec.querySelector('.reveal[data-for="other"]');
    if (ro) ro.hidden = !(oi >= 0 && picked.indexOf(oi) >= 0);
    var rd = sec.querySelector('.reveal[data-for="detail"]');
    if (rd) rd.hidden = !picked.some(function(j){ return q.o[j].d; });
    if (q.max){
      var real = picked.filter(function(j){ return !q.o[j].x; }).length;
      sec.querySelector(".limit").textContent = real + " of " + q.max + " chosen";
      sec.querySelectorAll(".opt").forEach(function(b){ var j = +b.dataset.j; b.classList.toggle("dim", real >= q.max && picked.indexOf(j) < 0 && !q.o[j].x); });
    }
  }
  okLabel(sec);
}

function textBox(q, a, n){
  var w = el("div"), t = el("textarea","line");
  t.rows = 1; t.placeholder = "Type your answer here…"; t.value = a.text;
  t.setAttribute("aria-labelledby", "q" + n); t.setAttribute("data-autofocus","");
  function grow(){ t.style.height = "auto"; t.style.height = t.scrollHeight + "px"; }
  t.addEventListener("input", function(){ a.text = t.value; grow(); okLabel(t.closest(".screen")); });
  setTimeout(grow, 0);
  w.appendChild(t);
  w.appendChild(el("p","enter",'<b>Shift ⇧ + Enter ↵</b> for a new line'));
  return w;
}

function contact(a){
  var w = el("div","fields"), c = a.contact;
  [["biz","Business name","text","organization"],["name","Your name","text","name"],["email","Email","email","email"]].forEach(function(f, k){
    var d = el("div","field");
    d.innerHTML = '<label for="c-'+f[0]+'">'+f[1]+'</label>';
    var i = el("input","line"); i.type = f[2]; i.id = "c-" + f[0]; i.value = c[f[0]]; i.autocomplete = f[3];
    if (k === 0) i.setAttribute("data-autofocus","");
    i.addEventListener("input", function(){ c[f[0]] = i.value; clearErr(); });
    d.appendChild(i); w.appendChild(d);
  });
  var p = el("div","field");
  p.appendChild(el("label",null,"May HSTA contact you about your responses?")).id = "perm-l";
  var opts = el("div","opts row"); opts.setAttribute("role","radiogroup"); opts.setAttribute("aria-labelledby","perm-l");
  ["Yes","No"].forEach(function(v, j){
    var b = el("button","opt",'<span class="key">'+KEYS[j]+'</span><span class="lab">'+v+'</span>'+SVG.tick);
    b.type = "button"; b.dataset.j = j; b.setAttribute("role","radio");
    var on = c.perm === v; b.classList.toggle("on", on); b.setAttribute("aria-checked", on ? "true" : "false");
    b.addEventListener("click", function(){
      c.perm = v; clearErr();
      opts.querySelectorAll(".opt").forEach(function(x){ var m = x === b; x.classList.toggle("on", m); x.setAttribute("aria-checked", m ? "true" : "false"); });
      b.classList.remove("blink"); void b.offsetWidth; b.classList.add("blink");
      if (v === "Yes" && !c.email.trim()) setTimeout(function(){ document.getElementById("c-email").focus(); }, 300);
    });
    opts.appendChild(b);
  });
  p.appendChild(opts); w.appendChild(p);
  return w;
}

function actions(n){
  var act = el("div","act"), last = n === total();
  var b = el("button","btn ok", (last ? esc(survey().submit) : "OK") + " " + SVG.ok);
  b.type = "button"; b.addEventListener("click", next);
  act.appendChild(b); act.appendChild(el("span","enter","press <b>Enter ↵</b>"));
  return act;
}

function okLabel(sec){
  if (!sec || !sec.dataset.n) return;
  var n = +sec.dataset.n, q = survey().qs[n-1], a = ans(n), b = sec.querySelector(".btn.ok");
  if (!b || n === total()) return;
  var empty = q.type === "text" ? !a.text.trim() : q.type === "check" ? !a.choices.length : q.type === "radio" ? a.choice == null : false;
  b.innerHTML = (empty && !q.req ? "Skip" : "OK") + " " + SVG.ok;
}

/* ---------- validation ---------- */
function problem(q, a){
  if (q.type === "radio" || q.type === "check"){
    var picked = q.type === "radio" ? (a.choice == null ? [] : [a.choice]) : a.choices;
    if (q.req && !picked.length) return q.type === "radio" ? "Please choose an answer." : "Please choose at least one.";
    var oi = q.o.indexOf(O);
    if (q.req && oi >= 0 && picked.indexOf(oi) >= 0 && !a.other.trim()) return "Please tell us what “Other” is.";
  }
  if (q.type === "contact"){
    var c = a.contact, em = c.email.trim();
    if (c.perm === "Yes" && !em) return "Add an email so HSTA can reach you, or choose No.";
    if (em && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(em)) return "That email doesn’t look complete.";
  }
  return "";
}
function showErr(sec, msg){
  var box = sec.querySelector(".errs"); box.innerHTML = "";
  var e = el("span","err", SVG.warn + esc(msg)); e.setAttribute("role","alert"); box.appendChild(e);
  var target = sec.querySelector(".opts") || sec.querySelector(".fields") || box;
  target.classList.remove("shake"); void target.offsetWidth; target.classList.add("shake");
}
function clearErr(){ var sec = stage.querySelector(".screen.cur"), b = sec && sec.querySelector(".errs"); if (b) b.innerHTML = ""; }

/* ---------- moving ---------- */
function next(){
  if (state.busy || !state.sid) return;
  var T = total(), i = state.i, sec = stage.querySelector(".screen.cur");
  if (i > T) return;
  if (i >= 1){
    var msg = problem(survey().qs[i-1], ans(i));
    if (msg){ showErr(sec, msg); return; }
    if (i === T){
      var b = sec.querySelector(".btn.ok"); b.classList.add("busy"); b.innerHTML = '<span class="spin"></span> Sending…';
      state.busy = true;
      if (DEMO){ setTimeout(function(){ state.busy = false; go(T + 1, 1); }, 900); return; }
      send(sec, b);
      return;
    }
  }
  go(i + 1, 1);
}
/* ---------- sending ---------- */
function payload(){
  var s = survey(), out = {response_id: state.rid, survey: state.sid, version: CONFIG.version || "", source: "web", website: document.getElementById("hp").value, answers: []};
  s.qs.forEach(function(q, k){
    var a = ans(k + 1), item = {n: k + 1, question: q.t}, oi = q.o ? q.o.indexOf(O) : -1;
    if (q.type === "radio"){
      item.answer = a.choice == null ? "" : label(q.o[a.choice]);
      if (a.choice != null && a.choice === oi) item.other = a.other.trim();
      if (q.detail && a.choice != null && q.o[a.choice].d) item.detail = a.detail.trim();
    } else if (q.type === "check"){
      item.answer = a.choices.slice().sort(function(x, y){ return x - y; }).map(function(j){ return label(q.o[j]); });
      if (oi >= 0 && a.choices.indexOf(oi) >= 0) item.other = a.other.trim();
    } else if (q.type === "text"){
      item.answer = a.text.trim();
    } else if (q.type === "contact"){
      var c = a.contact;
      item.answer = {business: c.biz.trim(), name: c.name.trim(), email: c.email.trim(), may_contact: c.perm || ""};
    }
    out.answers.push(item);
  });
  return out;
}
function send(sec, b){
  var T = total(), done = false;
  var timer = setTimeout(function(){ fail(); }, 25000);
  function fail(){
    if (done) return; done = true; clearTimeout(timer); state.busy = false;
    b.classList.remove("busy"); b.innerHTML = esc(survey().submit) + " " + SVG.ok;
    showErr(sec, "We couldn’t send your answers. Check your connection and try again. Nothing you entered was lost.");
  }
  fetch(CONFIG.endpoint, {method: "POST", headers: {"Content-Type": "text/plain;charset=utf-8"}, body: JSON.stringify(payload())})
    .then(function(r){ return r.json(); })
    .then(function(j){
      if (done) return;
      if (!j || !j.ok) return fail();
      done = true; clearTimeout(timer); state.busy = false; go(T + 1, 1);
    })
    .catch(fail);
}

function prev(){ if (!state.busy && state.sid && state.i > 1 && state.i <= total()) go(state.i - 1, -1); }

function endScreen(){
  var s = survey(), sec = el("section"), inner = el("div","inner");
  inner.appendChild(el("div",null,SVG.done));
  inner.appendChild(el("h1",null,esc(s.thanks)));
  inner.appendChild(el("div","follow",FOLLOW));
  if (DEMO) inner.appendChild(el("p","note","This was a demo, so your answers were not saved."));
  if (CONFIG.preset){ sec.appendChild(inner); return sec; }
  var act = el("div","act"), other = state.sid === "visitor" ? "member" : "visitor";
  var b1 = el("button","btn","Try the " + other + " survey " + SVG.arrow); b1.type = "button"; b1.setAttribute("data-autofocus","");
  b1.addEventListener("click", function(){ start(other); });
  var b2 = el("button","btn ghost","Back to start"); b2.type = "button";
  b2.addEventListener("click", function(){ try { history.replaceState(null, "", location.pathname + location.search); } catch(e){} chooser(); });
  act.appendChild(b1); act.appendChild(b2);
  inner.appendChild(act);
  sec.appendChild(inner);
  return sec;
}

/* ---------- keyboard ---------- */
document.addEventListener("keydown", function(e){
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  var t = e.target, typing = /INPUT|TEXTAREA/.test(t.tagName);
  if (e.key === "Enter"){
    if (t.tagName === "BUTTON") return;
    if (t.tagName === "TEXTAREA" && (e.shiftKey || touch)) return;
    if (state.sid){ e.preventDefault(); next(); }
    return;
  }
  if (typing || !state.sid) return;
  if (e.key === "ArrowDown"){ e.preventDefault(); next(); return; }
  if (e.key === "ArrowUp"){ e.preventDefault(); prev(); return; }
  if (/^[a-z]$/i.test(e.key)){
    var sec = stage.querySelector(".screen.cur");
    var b = sec && sec.querySelector('.opt[data-j="' + KEYS.indexOf(e.key.toUpperCase()) + '"]');
    if (b){ e.preventDefault(); b.click(); }
  }
});
var touch = window.matchMedia && matchMedia("(pointer:coarse)").matches;
document.addEventListener("focusin", function(e){ if (touch && /INPUT|TEXTAREA/.test(e.target.tagName)) document.body.classList.add("typing"); });
document.addEventListener("focusout", function(){ document.body.classList.remove("typing"); });
document.getElementById("next").addEventListener("click", next);
document.getElementById("prev").addEventListener("click", prev);

var hash = location.hash.slice(1);
if (CONFIG.preset) start(CONFIG.preset);
else if (SURVEYS[hash]) start(hash); else chooser();
</script>
